name: Update Zafran and Shiegiet Playlist

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

jobs:
  run-python:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests

      # PASTIKAN INI MENGEKSEKUSI filter_playlist.py
      - name: Run filter script
        run: python filter_playlist.py

      - name: Commit and push results
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add shiegiet zafran
          git diff --quiet && git diff --staged --quiet || git commit -m "Auto-update playlists zafran and shiegiet"
          git push
