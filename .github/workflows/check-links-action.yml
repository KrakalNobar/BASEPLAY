name: Check and Clean Links

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *' # Berjalan otomatis setiap hari (opsional)

jobs:
  run-link-checker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests

      - name: Run link checker script
        run: python check_links.py

      - name: Commit and push clean results
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add hasil
          git diff --quiet && git diff --staged --quiet || git commit -m "Auto-update clean playlist 'hasil'"
          git push
